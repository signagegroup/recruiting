<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSG Candidate Scoring</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;background:#f5f5f3;color:#1a1a1a;padding:1.5rem 16px}
.wrap{max-width:780px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.top img{height:64px;width:auto;display:block}
.top-right{display:flex;align-items:center;gap:10px}
.flags{display:flex;gap:4px}
.flag{font-size:22px;line-height:1;padding:4px 6px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;opacity:.4}
.flag.on{opacity:1;border-color:#ccc;background:#fff}
.reset{font-size:12px;color:#666;background:none;border:0.5px solid #ccc;border-radius:8px;padding:6px 10px;cursor:pointer}
.reset:hover{background:#fff}
.header{display:flex;align-items:stretch;justify-content:space-between;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-width:260px}
.meta .full{grid-column:1/-1}
.meta label{display:block;font-size:10px;font-weight:600;color:#888;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.meta input,.meta select{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-family:inherit}
.meta select{font-size:15px;font-weight:600;padding:9px 10px;cursor:pointer}
.scorebox{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1rem 1.25rem;text-align:center;min-width:150px;display:flex;flex-direction:column;justify-content:center}
.scorebox .label{font-size:11px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.scorebox .total{font-size:36px;font-weight:600;color:#1a1a1a}
.scorebox .of{font-size:11px;color:#888}
.scorebox .verdict{font-size:12px;font-weight:600;margin-top:6px}
.section{margin-bottom:1.25rem;background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;overflow:hidden}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:#f5f5f3;border-bottom:0.5px solid rgba(0,0,0,.1)}
.sec-title{font-size:13px;font-weight:600;color:#1a1a1a;flex:1}
.sec-weight{font-size:11px;color:#888;white-space:nowrap}
.sec-score{font-size:13px;font-weight:600;white-space:nowrap;min-width:52px;text-align:right}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:8px 14px;border-bottom:0.5px solid rgba(0,0,0,.08)}
.row:last-child{border-bottom:none}
.crit{font-size:13px;color:#1a1a1a}
.hint{font-size:12px;color:#666;line-height:1.4}
.w-badge{font-size:11px;color:#888;white-space:nowrap}
.stars{display:flex;gap:4px}
.star{width:26px;height:26px;border-radius:6px;border:0.5px solid #ccc;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#aaa;background:#fff;user-select:none}
.star.active-1,.star.active-2{background:#FAEEDA;color:#633806}
.star.active-3{background:#EAF3DE;color:#27500A}
.star.active-4{background:#E1F5EE;color:#085041}
.star.active-5{background:#EEEDFE;color:#3C3489}
.ko-skill{font-size:10px;font-weight:600;color:#791F1F;background:#FCEBEB;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.koflag{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:0.5px solid rgba(0,0,0,.08)}
.koflag:last-child{border-bottom:none}
.ko-label{font-size:13px;flex:1;color:#1a1a1a}
.ko-btn{font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;border:0.5px solid #ccc;cursor:pointer;background:#fff;color:#888;white-space:nowrap}
.ko-btn.ko-yes{background:#FCEBEB;color:#791F1F;border-color:#F09595}
.verdict-pad{padding:10px 14px}
.verdict-bar{display:flex;gap:8px;flex-wrap:wrap}
.vbtn{flex:1;min-width:90px;padding:10px;border-radius:8px;border:0.5px solid #ccc;cursor:pointer;font-size:13px;font-weight:600;background:#fff;color:#888;text-align:center}
.vbtn.sel-hire{background:#EAF3DE;color:#27500A;border-color:#97C459}
.vbtn.sel-r2{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}
.vbtn.sel-hold{background:#FAEEDA;color:#633806;border-color:#FAC775}
.vbtn.sel-no{background:#FCEBEB;color:#791F1F;border-color:#F09595}
.notes-area{width:100%;padding:10px 14px;font-size:13px;border:none;background:#fff;color:#1a1a1a;resize:vertical;min-height:90px;font-family:inherit;outline:none;line-height:1.5}
.export-body{padding:14px}
.export-hint{font-size:12px;color:#666;line-height:1.45;margin-bottom:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.export-btn{flex:1;min-width:150px;padding:12px;border:0.5px solid #ccc;border-radius:10px;background:#fff;color:#1a1a1a;font-size:13px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.export-btn.dark{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.export-btn.gpt{background:#10a37f;color:#fff;border-color:#10a37f}
.preview{margin-top:12px;display:none}
.preview textarea{width:100%;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.45;padding:10px;border:0.5px solid #ddd;border-radius:8px;background:#fafafa;color:#333;resize:vertical}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.progress-bar{height:3px;background:#e0e0e0;margin-top:8px;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .2s}
@media (max-width:600px){
  .top img{height:44px}
  .meta{grid-template-columns:1fr}
  .scorebox{width:100%}
  .row{grid-template-columns:1fr auto;}
  .row .stars{grid-column:1/-1}
  .row .w-badge{grid-row:1;grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <img src="https://signage-group.com/wp-content/uploads/2025/08/cropped-THE-SIGNAGE-GROUP-Logo-black.png" alt="The Signage Group" />
  <div class="top-right">
    <button class="reset" id="btn-reset" onclick="resetAll()"></button>
    <div class="flags">
      <button class="flag" data-l="de" onclick="setLang('de')" title="Deutsch">🇩🇪</button>
      <button class="flag" data-l="en" onclick="setLang('en')" title="English">🇬🇧</button>
    </div>
  </div>
</div>

<div class="header">
  <div class="meta">
    <div class="full"><label data-t="position"></label><select id="crole" onchange="switchProfile(this.value)"></select></div>
    <div><label data-t="name"></label><input id="cname" data-ph="namePh" /></div>
    <div><label data-t="date"></label><input id="cdate" type="date" /></div>
    <div><label data-t="interviewer"></label><input id="cint" value="Can" /></div>
    <div><label data-t="market"></label><input id="cmarket" data-ph="marketPh" /></div>
    <div><label data-t="available"></label><input id="cavail" data-ph="availPh" /></div>
    <div><label data-t="salary"></label><input id="csalary" data-ph="salaryPh" /></div>
    <div class="full"><label data-t="fathom"></label><input id="cfathom" placeholder="https://fathom.video/…" /></div>
  </div>
  <div class="scorebox">
    <div class="label" data-t="total"></div>
    <div class="total" id="total-score">0</div>
    <div class="of" data-t="of"></div>
    <div class="verdict" id="verdict-label">–</div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%;background:#888"></div></div>
  </div>
</div>

<div id="sections"></div>

<div class="section">
  <div class="sec-head"><span class="sec-title" data-t="koTitle"></span><span class="sec-weight" data-t="koSub"></span></div>
  <div id="ko-flags"></div>
</div>

<div class="section">
  <div class="sec-head"><span class="sec-title" data-t="final"></span></div>
  <div class="verdict-pad">
    <div class="verdict-bar">
      <div class="vbtn" id="v-hire" onclick="setVerdict('hire')">✓ Hire</div>
      <div class="vbtn" id="v-r2" onclick="setVerdict('r2')">→ Round 2</div>
      <div class="vbtn" id="v-hold" onclick="setVerdict('hold')">⊘ On Hold</div>
      <div class="vbtn" id="v-no" onclick="setVerdict('no')">✕ No Go</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="sec-head"><span class="sec-title" data-t="notes"></span></div>
  <textarea class="notes-area" id="final-notes" data-ph="notesPh"></textarea>
</div>

<div class="section">
  <div class="sec-head"><span class="sec-title" data-t="exportTitle"></span><span class="sec-weight">Claude · ChatGPT · Grok</span></div>
  <div class="export-body">
    <div class="export-hint" data-t="exportHint"></div>
    <div class="btn-row">
      <button class="export-btn" onclick="copyAll()" data-t="copy"></button>
      <button class="export-btn dark" onclick="openAI('claude')" data-t="claude"></button>
      <button class="export-btn gpt" onclick="openAI('gpt')" data-t="gpt"></button>
    </div>
    <div class="preview" id="preview"><textarea id="preview-text" readonly></textarea></div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

const ORDER=['sm','p1','p2','smgmt','ops','design','wh'];

/* ───────── State (autosave, per browser) ───────── */
const KEY='tsg-scoring-v2';
let lang='de', profile='sm', state={};
const META=['cname','cdate','cint','cmarket','cavail','csalary','cfathom','final-notes'];
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d){lang=d.lang||lang;profile=d.profile||profile;state=d.state||{};
  META.forEach(id=>{if(d.meta&&d.meta[id]!==undefined)document.getElementById(id).value=d.meta[id];});}}catch(e){}}
function save(){try{const meta={};META.forEach(id=>meta[id]=document.getElementById(id).value);
  localStorage.setItem(KEY,JSON.stringify({lang,profile,state,meta}));}catch(e){}}
META.forEach(id=>document.getElementById(id).addEventListener('input',save));

const P=()=>PROFILES[profile];
const st=()=>state[profile]||(state[profile]={scores:{},ko:{},verdict:null});
const L=o=>o[lang];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ───────── Render ───────── */
function setLang(l){
  lang=l; document.documentElement.lang=l;
  document.querySelectorAll('.flag').forEach(f=>f.classList.toggle('on',f.dataset.l===l));
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T[l][e.dataset.ph]);
  document.getElementById('btn-reset').textContent=T[l].reset;
  buildSelect(); render(); save();
}
function buildSelect(){
  document.getElementById('crole').innerHTML=ORDER.map(k=>`<option value="${k}"${k===profile?' selected':''}>${esc(L(PROFILES[k].name))}</option>`).join('');
}
function switchProfile(p){profile=p; render(); save();}
function render(){buildSections(); buildKO(); paintVerdict(); recalc(); hidePreview();}

function buildSections(){
  const box=document.getElementById('sections'); const sc=st().scores;
  box.innerHTML=P().sections.map(sec=>{
    sc[sec.id]=sc[sec.id]||{};
    const single=sec.cr.length===1;
    return `<div class="section">
      <div class="sec-head">
        <span class="sec-title">${esc(L(sec.t))}${sec.ko?`<span class="ko-skill">${T[lang].koSkill}</span>`:''}</span>
        <span class="sec-weight">${T[lang].weight}: ${sec.w}</span>
        <span class="sec-score" id="ss-${sec.id}">0 / ${sec.w}</span>
      </div>
      ${sec.cr.map((cr,i)=>{const v=sc[sec.id][i]||0; return `
        <div class="row">
          <span class="${single?'hint':'crit'}">${esc(L(cr))}</span>
          <span class="w-badge">${single?'':'×'+cr.w}</span>
          <div class="stars" id="stars-${sec.id}-${i}">
            ${[1,2,3,4,5].map(n=>`<div class="star ${n<=v?'active-'+v:''}" onclick="rate('${sec.id}',${i},${n})">${n}</div>`).join('')}
          </div>
        </div>`;}).join('')}
    </div>`;}).join('');
}
function buildKO(){
  const ko=st().ko;
  document.getElementById('ko-flags').innerHTML=P().ko.map((k,i)=>`<div class="koflag"><span class="ko-label">${esc(L(k))}</span><button class="ko-btn ${ko[i]?'ko-yes':''}" onclick="toggleKO(${i})">${ko[i]?T[lang].koYes:T[lang].koNo}</button></div>`).join('');
}
function rate(sec,i,n){
  const cur=st().scores[sec][i]; st().scores[sec][i]=(cur===n?0:n); // click again = reset
  const v=st().scores[sec][i];
  document.querySelectorAll(`#stars-${sec}-${i} .star`).forEach((s,k)=>s.className='star'+(k+1<=v?` active-${v}`:''));
  recalc(); save();
}
function toggleKO(i){st().ko[i]=!st().ko[i]; buildKO(); recalc(); save();}
function setVerdict(v){st().verdict=st().verdict===v?null:v; paintVerdict(); save();}
function paintVerdict(){const v=st().verdict;['hire','r2','hold','no'].forEach(k=>document.getElementById('v-'+k).className='vbtn'+(k===v?` sel-${k}`:''));}

/* ───────── Scoring ───────── */
function score(){
  let grand=0,koFail=false,hasOne=false; const cats=[]; const sc=st().scores;
  P().sections.forEach(sec=>{
    const s=sc[sec.id]||{};
    const max=sec.cr.reduce((a,c)=>a+c.w*5,0);
    const raw=sec.cr.reduce((a,c,i)=>a+c.w*(s[i]||0),0);
    const pts=Math.round(raw/max*sec.w); grand+=pts;
    const ratedW=sec.cr.reduce((a,c,i)=>a+(s[i]?c.w:0),0);
    const avg=ratedW?raw/ratedW:0;
    if(sec.ko&&ratedW&&avg<3) koFail=true;
    if(sec.cr.some((c,i)=>s[i]===1)) hasOne=true;
    cats.push({sec,pts,avg,stars:sec.cr.map((c,i)=>s[i]||0)});
    const el=document.getElementById('ss-'+sec.id); if(el) el.textContent=`${pts} / ${sec.w}`;
  });
  const koList=P().ko.filter((k,i)=>st().ko[i]).map(L);
  return {grand,cats,koFail,hasOne,koList};
}
function band(r){
  const t=T[lang];
  if(r.koList.length) return [100,'#E24B4A','#791F1F',t.disq];
  if(P().bands==='kam'){
    if(r.hasOne) return [r.grand,'#E24B4A','#791F1F',t.stop];
    if(r.koFail) return [r.grand,'#BA7517','#633806',t.passfail];
    if(r.grand>=75) return [r.grand,'#639922','#27500A',t.strongI3];
    if(r.grand>=60) return [r.grand,'#7F77DD','#3C3489',t.pass];
    return [r.grand,'#E24B4A','#791F1F',t.below];
  }
  if(r.koFail) return [r.grand,'#BA7517','#633806',t.passfail];
  if(r.grand>=80) return [r.grand,'#639922','#27500A',t.strong];
  if(r.grand>=65) return [r.grand,'#7F77DD','#3C3489',t.r2];
  if(r.grand>=50) return [r.grand,'#BA7517','#633806',t.hold];
  return [r.grand,'#E24B4A','#791F1F',t.no];
}
function recalc(){
  const r=score(); const [w,bg,fg,label]=band(r);
  document.getElementById('total-score').textContent=r.koList.length?'K.O.':r.grand;
  const p=document.getElementById('prog'); p.style.width=w+'%'; p.style.background=bg;
  const v=document.getElementById('verdict-label'); v.style.color=fg; v.textContent=label;
}

/* ───────── Export: prompt + scoring ───────── */
const PROMPT={
de:`Du bist HR-Analyst der The Signage Group (OTSG). Erstelle aus dem Interview-Scoring unten EINE Kandidaten-Auswertung auf genau einer A4-Seite.

FORMAT
- Eine eigenständige HTML-Datei (CSS inline, keine externen Bilder), druckfertig A4 hochkant (@page size A4; margin 14mm). Wenn möglich als Artifact / Canvas ausgeben.
- Apple Style: Schrift -apple-system / SF Pro / Helvetica; Schwarz und Grautöne auf Weiß; Karten in hellem Grau (#f5f5f7, Radius 14px); viel Weißraum; keine Farben außer kleinen roten Punkten bei Risiken.
- Muss auf EINE Seite passen. Lieber kürzen als umbrechen.

AUFBAU
1. Kopf: Name groß und fett. Unterzeile: Position · Markt/Standort · Interviewdatum · Interviewer · Fathom-Link. Rechts oben ein Pill mit der Empfehlung (schwarz, weiße Großbuchstaben).
2. Drei Karten nebeneinander: SCORE (x / 100, bei Bedarf „kalibriert x–y“ + 1 Zeile Begründung) · VERFÜGBAR (Datum + 1 Zeile) · GEHALT (Wert oder „Offen“ + 1 Zeile).
3. KEY FACTS: max. 6 Stichpunkte.
4. STÄRKEN | WATCH (zwei Spalten): je max. 4 Stichpunkte; bei WATCH rote Punkte, Kernaussage fett am Anfang.
5. WARUM <EMPFEHLUNG>: 3–4 Sätze in grauer Karte – die Entscheidungslogik.
6. NÄCHSTE SCHRITTE: Tabelle mit max. 4 Zeilen: **Aufgabe** – kurzes Detail | Owner | Deadline.
7. Fußzeile (klein, grau): Scoring je Kategorie, K.O.-Flags.

REGELN
- Jeder Stichpunkt max. 15 Wörter. Fakten und Zahlen, keine Füllwörter, keine Adjektive ohne Beleg.
- Scores kritisch prüfen: Ist ein hoher Wert durch Notizen/Transkript nicht belegt, markieren und eine kalibrierte Spanne nennen.
- Nichts erfinden. Fehlt eine Info: „Offen“ / „nicht besprochen“.
- Hast du Zugriff auf den Fathom-Link oder ein Transkript, nutze es. Sonst nur die Daten unten.
- Sprache: Deutsch.

SCORING-DATEN
`,
en:`You are the HR analyst of The Signage Group (OTSG). Turn the interview scoring below into ONE candidate assessment on exactly one A4 page.

FORMAT
- One self-contained HTML file (inline CSS, no external images), print-ready A4 portrait (@page size A4; margin 14mm). Output as an artifact / canvas if available.
- Apple style: font -apple-system / SF Pro / Helvetica; black and greys on white; light grey cards (#f5f5f7, radius 14px); generous whitespace; no colour except small red dots for risks.
- Must fit on ONE page. Cut rather than overflow.

STRUCTURE
1. Header: name large and bold. Subline: position · market/location · interview date · interviewer · Fathom link. Top right a pill with the recommendation (black, white uppercase).
2. Three cards side by side: SCORE (x / 100, if needed “calibrated x–y” + 1-line reason) · AVAILABLE (date + 1 line) · SALARY (value or “Open” + 1 line).
3. KEY FACTS: max. 6 bullets.
4. STRENGTHS | WATCH (two columns): max. 4 bullets each; WATCH with red dots, core statement bold at the start.
5. WHY <RECOMMENDATION>: 3–4 sentences in a grey card – the decision logic.
6. NEXT STEPS: table with max. 4 rows: **Task** – short detail | Owner | Deadline.
7. Footer (small, grey): scoring per category, K.O. flags.

RULES
- Every bullet max. 15 words. Facts and numbers, no filler, no adjectives without evidence.
- Challenge the scores: if a high score is not backed by the notes/transcript, flag it and give a calibrated range.
- Never invent facts. Missing info: “Open” / “not discussed”.
- If you can access the Fathom link or a transcript, use it. Otherwise only the data below.
- Language: English.

SCORING DATA
`};

function scoringText(){
  const r=score(); const t=T[lang]; const g=id=>document.getElementById(id).value.trim()||'–';
  const d=document.getElementById('cdate').value; const date=d?d.split('-').reverse().join('.'):'–';
  const vMap={hire:'Hire',r2:'Round 2',hold:'On Hold',no:'No Go'};
  const lines=r.cats.map(c=>{
    const head=`- ${L(c.sec.t)}: ${c.pts}/${c.sec.w}${c.sec.ko?' [KO-Skill]':''}`;
    if(c.sec.cr.length===1) return `${head} · ${c.stars[0]||'–'}/5`;
    return head+'\n'+c.sec.cr.map((cr,i)=>`    · ${L(cr)}: ${c.stars[i]||'–'}/5`).join('\n');
  }).join('\n');
  return [
    `${t.position}: ${L(P().full)}`,
    `${t.name}: ${g('cname')} | ${t.date}: ${date} | ${t.interviewer}: ${g('cint')}`,
    `${t.market}: ${g('cmarket')} | ${t.available}: ${g('cavail')} | ${t.salary}: ${g('csalary')}`,
    `Fathom: ${g('cfathom')}`,
    ``,
    `SCORE: ${r.koList.length?'K.O.':r.grand+'/100'} → ${band(r)[3]}`,
    `${t.final}: ${vMap[st().verdict]||'–'}`,
    ``,
    lines,
    ``,
    `K.O.: ${r.koList.join('; ')||'–'}`,
    ``,
    `${t.notes}:`,
    g('final-notes')
  ].join('\n');
}
const fullText=()=>PROMPT[lang]+scoringText();

function toast(msg){const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1800);}
function copy(text){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);};
  return (navigator.clipboard?navigator.clipboard.writeText(text).catch(fallback):Promise.resolve(fallback()));
}
function showPreview(text){const p=document.getElementById('preview'); document.getElementById('preview-text').value=text; p.style.display='block';}
function hidePreview(){document.getElementById('preview').style.display='none';}
function copyAll(){const tx=fullText(); copy(tx).then(()=>toast(T[lang].copied)); showPreview(tx);}
function openAI(which){
  const tx=fullText(); copy(tx);
  const q=encodeURIComponent(tx);
  window.open(which==='claude'?'https://claude.ai/new?q='+q:'https://chatgpt.com/?q='+q,'_blank');
}
function resetAll(){
  if(!confirm(T[lang].resetQ)) return;
  state={}; META.forEach(id=>{const e=document.getElementById(id); e.value=id==='cint'?'Can':'';});
  render(); save();
}

/* ───────── Init ───────── */
load();
if(!document.getElementById('cdate').value) document.getElementById('cdate').value=new Date().toISOString().slice(0,10);
setLang(lang);
</script>
